camera:
  # 上から順に優先。接続されているものが起動時に自動選択される。
  # 複数同時に刺さっている場合はリスト先頭に近いものだけが配信される。
  #
  # device: 整数 (V4L2 index) または文字列 (デバイスパス) を受け付ける。
  # USB ポートが変わるとインデックスが変動するので、固定 ID パスの利用を推奨。
  #   /dev/v4l/by-id/usb-..-video-index0
  devices:
    - name: 2K USB Camera
      device: /dev/v4l/by-id/usb-DC474C08_P050301_SN0002_2K_USB_Camera_DC474C08_P050301_SN0002-video-index0
    - name: Jieli Camera
      device: /dev/v4l/by-id/usb-Jieli_Technology_USB_PHY_2.0-video-index0
    - name: ELECOM 2MP Webcam
      device: /dev/v4l/by-id/usb-Alcor_Micro__Corp._ELECOM_2MP_Webcam-video-index0

  # devices 内で width/height/fps が省略されたときの既定値。
  defaults:
    width: 640
    height: 480
    fps: 30

model:
  # PyTorch (ROCm) で直接推論する。ONNX/MIGraphX 経路は廃止。
  # repo: Depth Anything V2 公式リポジトリ (depth_anything_v2 パッケージを import する)
  repo: Depth-Anything-V2
  encoder: vits           # vits / vitb / vitl / vitg
  checkpoint: Depth-Anything-V2/checkpoints/depth_anything_v2_vits.pth
  # DPT ヘッドの制約で 14 の倍数であること (518 = 14 x 37)。
  input_size: 518

server:
  host: 0.0.0.0
  port: 8000
  jpeg_quality: 80

runtime:
  device: cuda            # ROCm の HIP 層が CUDA API を受けるので gfx1151 でも "cuda"
  precision: fp16         # fp16 / fp32
  # torch.compile による最適化。初回コンパイルに 1〜2 分かかるが数割速くなる。
  # まず false (eager) で FPS を測り、不足する場合のみ true にする。
  compile: false
