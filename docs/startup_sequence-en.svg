<svg xmlns="http://www.w3.org/2000/svg" width="820" height="330" viewBox="0 0 820 330">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#333"/>
    </marker>
    <style>
      .box { fill:#f7f7f7; stroke:#333; stroke-width:1.2; }
      .warmbox { fill:#e6f4ea; stroke:#137333; stroke-width:1.2; }
      .compilebox { fill:#fff8e1; stroke:#b6862c; stroke-width:1.2; }
      .loopbox { fill:#e8f0fe; stroke:#1a73e8; stroke-width:1.2; }
      text { font-family: -apple-system, 'Segoe UI', sans-serif; fill:#222; font-size:12px; }
      .title { font-weight:600; font-size:14px; }
      .small { font-size:11px; fill:#555; }
      .stage-title { font-weight:600; font-size:13px; }
      line.flow { stroke:#333; stroke-width:1.2; fill:none; }
    </style>
  </defs>

  <text x="410" y="26" text-anchor="middle" class="title" font-size="16">Startup sequence (PyTorch / ROCm)</text>
  <text x="410" y="46" text-anchor="middle" class="small">Every start is identical — there is no compile cache to warm up</text>

  <!-- Default row -->
  <text x="60" y="88" class="stage-title">Default (eager, fp16)</text>
  <rect class="box" x="60" y="100" width="130" height="52" rx="4"/>
  <text x="125" y="122" text-anchor="middle">launch app.py</text>
  <text x="125" y="138" text-anchor="middle" class="small">read config.yaml</text>

  <rect class="box" x="210" y="100" width="160" height="52" rx="4"/>
  <text x="290" y="122" text-anchor="middle">import + build model</text>
  <text x="290" y="138" text-anchor="middle" class="small">load .pth (~1 s)</text>

  <rect class="warmbox" x="390" y="100" width="190" height="52" rx="4"/>
  <text x="485" y="122" text-anchor="middle">GPU warmup (JIT / MIOpen)</text>
  <text x="485" y="138" text-anchor="middle" class="small">3 dummy forwards (~7 s)</text>

  <rect class="loopbox" x="600" y="100" width="150" height="52" rx="4"/>
  <text x="675" y="122" text-anchor="middle">Flask + worker loop</text>
  <text x="675" y="138" text-anchor="middle" class="small">26 FPS (camera-bound)</text>

  <line class="flow" x1="190" y1="126" x2="210" y2="126" marker-end="url(#arrow)"/>
  <line class="flow" x1="370" y1="126" x2="390" y2="126" marker-end="url(#arrow)"/>
  <line class="flow" x1="580" y1="126" x2="600" y2="126" marker-end="url(#arrow)"/>

  <text x="60" y="176" class="small" fill="#137333">Total ~7 s until /stats responds</text>

  <!-- torch.compile row -->
  <text x="60" y="222" class="stage-title">With runtime.compile: true</text>
  <rect class="box" x="60" y="234" width="130" height="52" rx="4"/>
  <text x="125" y="256" text-anchor="middle">launch app.py</text>
  <text x="125" y="272" text-anchor="middle" class="small">read config.yaml</text>

  <rect class="box" x="210" y="234" width="160" height="52" rx="4"/>
  <text x="290" y="256" text-anchor="middle">import + build model</text>
  <text x="290" y="272" text-anchor="middle" class="small">load .pth (~1 s)</text>

  <rect class="compilebox" x="390" y="234" width="190" height="52" rx="4"/>
  <text x="485" y="256" text-anchor="middle">torch.compile + warmup</text>
  <text x="485" y="272" text-anchor="middle" class="small">~1-2 min (optional)</text>

  <rect class="loopbox" x="600" y="234" width="150" height="52" rx="4"/>
  <text x="675" y="256" text-anchor="middle">Flask + worker loop</text>
  <text x="675" y="272" text-anchor="middle" class="small">still camera-bound</text>

  <line class="flow" x1="190" y1="260" x2="210" y2="260" marker-end="url(#arrow)"/>
  <line class="flow" x1="370" y1="260" x2="390" y2="260" marker-end="url(#arrow)"/>
  <line class="flow" x1="580" y1="260" x2="600" y2="260" marker-end="url(#arrow)"/>

  <text x="60" y="310" class="small" fill="#b6862c">Off by default: eager already outruns the 30 fps camera</text>
</svg>
